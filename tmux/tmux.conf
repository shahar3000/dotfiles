# ~/.tmux.conf — portable (Linux-first, macOS-aware)

# vi mode
setw -g mode-keys vi
bind P paste-buffer
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi r send -X rectangle-toggle
# Escape cancels the selection but stays in copy-mode (vim-like)
bind -T copy-mode-vi Escape send -X clear-selection
# H / L jump to top / bottom of the visible screen
bind -T copy-mode-vi H send -X top-line
bind -T copy-mode-vi L send -X bottom-line

# Clipboard copy — 'y' copies to tmux buffer; the system-clipboard bridge is
# platform-specific and set by install.sh in ~/.tmux.local.conf (sourced at
# bottom). Fallback below just copies to the tmux buffer if that file is absent.
bind -T copy-mode-vi y send -X copy-selection

# Prefix: C-b (tmux default — no flow-control/terminal conflicts, works on WSL).
# If you prefer C-s, add 'stty -ixon' to your shell rc first (Ctrl-S is terminal
# flow control / XOFF and will freeze output otherwise), then:
#   set-option -g prefix C-s ; unbind C-b ; bind C-s send-prefix
set-option -g prefix C-b

set -g mouse off

# split panes using | and -, keep cwd
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind h set-window-option synchronize-panes\; display "Synchronize-panes #{?pane_synchronized,on,off}"
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# ---- vim-tmux-navigator: Shift-arrows cross vim splits AND tmux panes ----
# Detect whether the active pane is running vim/nvim; if so pass the key through.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n S-Left  if-shell "$is_vim" "send-keys S-Left"  "select-pane -L"
bind-key -n S-Down  if-shell "$is_vim" "send-keys S-Down"  "select-pane -D"
bind-key -n S-Up    if-shell "$is_vim" "send-keys S-Up"    "select-pane -U"
bind-key -n S-Right if-shell "$is_vim" "send-keys S-Right" "select-pane -R"

# switch panes with Alt-arrow (no prefix) — kept from original
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# True color inside tmux: without this, tmux downgrades nvim's termguicolors to
# 256-color and gruvbox looks wrong inside tmux. tmux-256color advertises the
# right base caps; then we must declare the OUTER terminal supports 24-bit RGB.
#   - terminal-features (tmux >= 3.2): applies to ANY outer $TERM — most robust,
#     so it works on the AWS web terminal / WSL / iTerm regardless of its TERM.
#   - terminal-overrides: fallback for older tmux, matching common TERM patterns.
# After editing, RESTART the server ('tmux kill-server') — a running server won't
# pick this up, which is why 'tmux info | grep RGB' can still show [missing].
set -g default-terminal "tmux-256color"
set -ga terminal-features ",*:RGB"
set -ga terminal-overrides ",*:Tc"
bind-key b set-option status
set -g history-limit 10000
set -g display-panes-time 2000
set -g set-titles on
set -g set-titles-string "tmux:#I #W"

#### statusbar — gruvbox powerline (needs a Nerd Font for the  glyphs) ####
# gruvbox: bg0 #282828  bg2 #504945  bg3 #665c54  fg #ebdbb2  yellow #d79921
#          green #b8bb26  gray #a89984 ·  U+E0B0 (right sep)   U+E0B2 (left sep)
set -g status-interval 5
set -g status-justify centre
set -g status-style "fg=#ebdbb2,bg=#282828"

# LEFT: session · window · pane, powerline  (U+E0B0) separators pointing right.
# Each separator: fg = the bg of the segment it trails, bg = the next segment's bg.
set -g status-left "#[fg=#282828,bg=#d79921,bold]  #S #[fg=#d79921,bg=#504945]#[fg=#ebdbb2,bg=#504945] #I:#P #[fg=#504945,bg=#282828]#[default]"
set -g status-left-length 40

# RIGHT: free disk · clock · date, powerline  (U+E0B2) separators pointing left.
# Each separator: fg = the bg of the segment it precedes, bg = the previous bg.
set -g status-right "#[fg=#504945,bg=#282828]#[fg=#ebdbb2,bg=#504945]  #(df -hP / | awk 'NR==2{print \$4}') free #[fg=#665c54,bg=#504945]#[fg=#ebdbb2,bg=#665c54]  %H:%M #[fg=#d79921,bg=#665c54]#[fg=#282828,bg=#d79921,bold]  %e/%m/%Y #[default]"
set -g status-right-length 80

# window list: current window highlighted green
set-window-option -g window-status-current-format "#[fg=#282828,bg=#b8bb26,bold] #I:#W#F "
set-window-option -g window-status-format "#[fg=#a89984,bg=#282828] #I:#W#F "

set -g message-style "fg=#282828,bg=#d79921"
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#d79921"

set -s escape-time 0

# Machine-specific tmux settings (clipboard binding, etc.) — untracked.
# Written by install.sh; safe to hand-edit. if-shell guards against absence.
if-shell '[ -f ~/.tmux.local.conf ]' 'source-file ~/.tmux.local.conf'
